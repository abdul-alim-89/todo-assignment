<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Todo App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="./index.css">
</head>
<body>

<main>
<section>
    <h1 style="text-align: center;" class="top-heading">Todo App</h1>
    <div class="form-section">
        <form id="add-todo">
            <input type="text" name="title" placeholder="Add title" required>
            <input type="submit" value="Add Todo">
        </form>
    </div>
   <div class="todo-section">
   <ul id="todo-lists">
    <!-- <li>
        <h4>Todo title</h4>
        <p><select>
            <option value="true">Completed</option>
            <option value="false" selected>In-progress</option>
        </select></p>
        <div>
        <p>Created: </p>
        <p>Updated: </p>
        </div>
        <div class="action">
            <button onclick="get_todo('1')">Edit</button>
            <button onclick="delete_todo('1')">Delete</button>
        </div>
    </li> -->
   </ul>
   </div>
</table>
</section>
<div id="update-todo-model" class="model">
    <div class="model-content">
    <span style="text-align: right;" id="close-btn">X</span>
    <h3>Update Todo</h3>
<form id="update-todo">
<label for="title">Title</label><br>
<input type="text" name="title" id="update-title" required><br>
<label for="status">Status</label><br>
<select id="update-status" name="status" required>
            <option value="true">Completed</option>
            <option value="false">In-progress</option>
        </select><br>
<input type="hidden" id="update-todo-id" name="todo-id" value="">
<input type="submit" value="Update Todo">

</form>
</div>
</div>
</main>
<script>

let todos = [];
const form = document.getElementById("add-todo");
const ul = document.getElementById("todo-lists");
const update_form = document.getElementById("update-todo");
const model = document.getElementById("update-todo-model");
const closeBtn = document.getElementById("close-btn");
console.log(model);

form.addEventListener("submit", add_todo);
update_form.addEventListener("submit", update_todo);
closeBtn.addEventListener("click", close_model);
function close_model(){
  model.style.display = "none";
}
function add_todo(e){
 e.preventDefault();
   const formData = e.target;
   const formValue = new FormData(formData);
   const title = formValue.get("title");
   if(title.trim() == ''){
    alert("Title is required");
    return
   }
   const date = new Date();
   const simple_date = new Date(date).toLocaleDateString();
   console.log(title)
   let todo = {
    id: todos.length + 1,
    title: title,
    isCompleted: false,
    created: simple_date,
    updated: ''
   }
   todos.push(todo);
   console.log(todos)
   form.reset();
   display_todos();
}
function update_todo(e){
e.preventDefault();
 
 const formData = e.target;
 const formValue = new FormData(formData);
 console.log(formValue);
 const title = formValue.get("title");
 const id = formValue.get("todo-id");
 const status = formValue.get("status");
const find_todo = todos.find((item)=>{
    return item.id == id
})

if(!find_todo)
{
    alert("Todo not found")
}
const date = new Date();
const simple_date = new Date(date).toLocaleDateString();
find_todo.title = title;
find_todo.isCompleted = status;
find_todo.updated = simple_date;
update_form.reset();
model.style.display = "none";
display_todos();

}
function delete_todo(id){

    const filter_todo = todos.filter((item)=>{
        return item.id != id
    })
    todos = filter_todo;
    display_todos();

}

function get_todo(id){
const get_todo = todos.find((item)=>{
    return item.id == id;
})

document.getElementById("update-title").value = get_todo.title;
document.getElementById("update-status").value = get_todo.isCompleted;
document.getElementById("update-todo-id").value = get_todo.id;
model.style.display = "block";

}

function update_status(id){
const todo = todos.find((item)=>{
    return item.id == id
})
todo.isCompleted = !todo.isCompleted;
display_todos();
console.log(todos);
}

function display_todos(){
    let content = '';
    if(todos.length == 0){
        content += '<li> todo not found </li>';
        ul.innerHTML = content;
        return;
       
    }
todos.map((item)=>{
    content += `<li>
        <div class="top-con">
        <h3 class="todo-title">${item.title}</h3>
        <div class="action">
            <i class='fas fa-edit'></i>
            <span onclick="get_todo('${item.id}')"><i style="color:black;" class="fa fa-edit"></i></span>
            <span onclick="delete_todo('${item.id}')"><i style="color:black;" class="fa fa-trash-o"></i></span>
        </div>
        </div>
        <p><select class="status" onchange="update_status('${item.id}')">
            <option value="true" ${item.isCompleted == true ? "selected": ""}>Completed</option>
            <option value="false" ${item.isCompleted == false ? "selected": ""}>In-progress</option>
        </select></p>
        <div class="date-section">
        <p>Created: ${item.created}</p>`;
        if(item.updated) {
            content += `<p>Updated: ${item.updated}</p>`;
        }
        else{
            content += '';
        }

        //content += (item.updated === '' ? `<p>Updated: ${item.updated}</p>` : '');
        
        content += `</div>
        
    </li>`;
})

ul.innerHTML = content;
}
display_todos();



</script>
</body>
</html>
